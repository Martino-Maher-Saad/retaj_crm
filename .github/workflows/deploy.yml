name: Deploy Flutter Web to Pages

on:
  push:
    branches:
      - main # النشر يعمل فقط عندما ترفع كود لفرع main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'

      - run: flutter pub get

      # ==========================================
      # 1. Build & Deploy على Hostinger
      # ==========================================
      - name: Build Web for Hostinger
        # Hostinger بيستخدم base-href / لأن الدومين هو الرئيسي مباشرة
        run: flutter build web --release --base-href /

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        # لو فشل الاتصال بـ Hostinger، يكمل ويرفع على GitHub Pages
        continue-on-error: true
        with:
          server: 31.170.160.8
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          local-dir: ./build/web/
          # ./ لأن حساب الـ FTP مربوط بالمجلد الصح مباشرة
          server-dir: ./

      # ==========================================
      # 2. Build & Deploy على GitHub Pages
      # ==========================================
      - name: Build Web for GitHub Pages
        # GitHub Pages محتاج اسم الريبو في الـ base-href
        run: flutter build web --release --base-href /retaj_crm/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4